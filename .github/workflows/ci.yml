name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint, typecheck, build, and the checks that inspect the built package
  # (publint, arethetypeswrong) — none of these need a database.
  static:
    runs-on: ubuntu-latest
    steps:
      # These three majors are the first ones that declare `using: node24`.
      # v4 of each still ran, but only because the runner force-migrated them
      # off the deprecated Node 20, which it warns about on every job and will
      # eventually stop doing.
      #
      # Two behaviour changes in this range were checked rather than assumed:
      # setup-node v6 narrowed *automatic* caching to npm, which does not apply
      # here because `cache: pnpm` is passed explicitly and is still a supported
      # value in v7; and checkout v6 moved persisted git credentials to a
      # separate file, which does not affect the release job because
      # changesets/action authenticates its own push rather than reusing
      # checkout's credentials.
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Prints the pnpm version actually resolved from `packageManager` in
      # package.json, so a future drift between the pin and what a runner
      # picks up is visible in the log rather than silent.
      - run: pnpm --version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm size
      # Typechecks examples/*/src/*.ts against dist/*.d.ts — the declarations a
      # consumer actually installs, not src/. Mapping to src/ instead looks
      # equivalent and is not: it drags the package's own dependency graph into
      # the check and reports errors no consumer would ever see. An example that
      # no longer compiles is a broken first impression, and nothing else in
      # this workflow reads examples/ at all.
      - run: pnpm check:examples
      # Packs the tarball `npm publish` would ship, installs it into a
      # throwaway project alongside real wrangler, and runs `wrangler deploy
      # --dry-run` for every published entry point. Nothing else in this
      # workflow builds the package the way a consumer does: both vitest
      # projects resolve modules lazily, so a `require()` of an absent
      # optional dependency sitting in a dependency's reachable graph passes
      # every test here and still breaks every consumer's build. That exact
      # defect shipped once and was invisible to a fully green suite.
      #
      # Slow (a real `npm install`, then one esbuild pass per entry point)
      # and network-dependent, which is why it is a separate step and not
      # part of `pnpm test`. It runs on every push and PR rather than only
      # before publish, so the break surfaces at review time; `release`
      # needs this job, so publish stays gated either way.
      - name: verify the published package builds in a consumer's Worker
        run: pnpm verify:bundle

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # gitleaks scans commit history, not just the working tree — a shallow
      # checkout would only let it see the single most recent commit.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # v3 is a runtime bump and nothing else — same inputs, outputs and
      # behaviour, per its release notes. Not optional for long: Node 20
      # leaves GitHub-hosted runners on 2026-09-16, at which point v2 stops
      # running at all rather than being force-migrated as it is today.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for organization-owned repos, not personal
          # accounts; harmless if unset. Picks up .gitleaks.toml at the repo
          # root automatically.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  # Every database this project talks to, brought up as service containers.
  # Runs the full suite (unit + integration + types — `pnpm test` with no
  # --project flag covers all three vitest projects) against two declared
  # peer knex versions.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        knex: ['3.1.0', '3.3.0']
    services:
      mysql:
        image: mysql:8
        ports: ['3306:3306']
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: cf_knex_test }
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
      mariadb:
        image: mariadb:11
        ports: ['3307:3306']
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: cf_knex_test }
        options: >-
          --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=20
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: cf_knex_test }
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=20
      libsql:
        # Pinned by digest, matching docker-compose.yml's own libsql service
        # exactly — see that file for why (a floating :latest tag once took
        # every other service's pull down with it in one `docker compose up`
        # run). The image ships no curl/wget, so the health check below is a
        # raw TCP connect via bash's /dev/tcp, not an HTTP probe; confirmed
        # against the running container that this actually exercises the
        # right port and that bash is present in the image.
        image: ghcr.io/tursodatabase/libsql-server@sha256:07d5da358f37f7f327cc33c1cb5278e7892e04225f011a65a76049372a308982
        ports: ['8080:8080']
        env: { SQLD_NODE: primary }
        options: >-
          --health-cmd="bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'" --health-interval=5s --health-retries=20
    env:
      MYSQL_URL: mysql://root:root@127.0.0.1:3306/cf_knex_test
      MARIADB_URL: mysql://root:root@127.0.0.1:3307/cf_knex_test
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/cf_knex_test
      LIBSQL_URL: http://127.0.0.1:8080
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_MYSQL: mysql://root:root@127.0.0.1:3306/cf_knex_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_PG: postgres://postgres:postgres@127.0.0.1:5432/cf_knex_test
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --version
      # Mutates the installed knex version in place, on top of the frozen
      # install above, to exercise the declared `peerDependencies` range.
      # Deliberate: this job's install is reproducible up to this line and
      # not after it, unlike `static`'s.
      - run: pnpm add -D knex@${{ matrix.knex }}
      # `pnpm run <script> <flags>` — explicit `run`, and no `--` separator.
      # The `--`-less form is the load-bearing half:
      #
      #   pnpm run test -- --outputFile=x   -> vitest gets `"--" "--outputFile=x"`
      #                                        as positionals; NO report, exit 0
      #
      # That is the whole reason for this comment. A missing report does not
      # fail the test run — it fails the assert step below, as "report not
      # found", with nothing pointing back at the flags that caused it.
      #
      # The explicit `run` is belt-and-braces rather than strictly required
      # now. Under pnpm 9 `pnpm test --outputFile=x` died on "Unknown option:
      # outputFile", because `test` is a pnpm built-in that parsed the flag
      # itself; pnpm 11 forwards it to the script instead. Re-verified against
      # pnpm 11.20.0, all three spellings, on these exact commands. Keeping
      # `run` costs nothing and does not depend on which pnpm a runner picks.
      - run: pnpm run test --reporter=default --reporter=json --outputFile=vitest-report.json
      # Every database above is genuinely up in this job, so none of their
      # conformance suites should ever take the "URL not set" skip path. A
      # green `pnpm test` alone can't tell "ran and passed" apart from
      # "silently skipped" — see the script for why.
      - name: assert the docker-backed suites actually ran
        run: .github/scripts/assert-required-suites-ran.sh vitest-report.json MYSQL_URL MARIADB_URL POSTGRES_URL LIBSQL_URL

  # The cloud-only tier: TiDB Serverless, Turso, and Neon. No service
  # containers here; these are real hosted services reached with repository
  # secrets.
  #
  # Deliberately not run on pull requests, only on master and on manual
  # dispatch. Two reasons. Forked PRs never receive repository secrets, so the
  # job could only ever be skipped there. And on same-repo PRs it is the one
  # job that costs real quota on three free hosted tiers, charged again on
  # every push to the branch — which is most of what a review cycle is.
  #
  # The trade this makes: a regression in a hosted-tier adapter now turns
  # master red rather than the PR that caused it. It can still never reach
  # npm, because `release` below requires this job to have genuinely
  # succeeded on the very push it would publish from. If that trade stops
  # being worth it, the middle setting is a `paths` filter that runs this on
  # PRs touching src/adapters/** and skips it for docs and test changes.
  live:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      TIDB_URL: ${{ secrets.TIDB_URL }}
      # A second Serverless cluster under different credentials, for the
      # cross-credential isolation suite only. Nothing else reads it.
      TIDB_URL_2: ${{ secrets.TIDB_URL_2 }}
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      NEON_URL: ${{ secrets.NEON_URL }}
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # All three hosted suites live under test/integration/ (each gated on
      # its credential with the same test.skip placeholder pattern as the
      # docker-backed suites) and so run under the `node` vitest project —
      # there is no separate test/live directory. Nothing else runs here:
      # the docker-backed suites have no services in this job and take their
      # own skip path, which is why they are not named in the assert below.
      # Same `pnpm run <script> <flags>` form as the `test` job — see there.
      - run: pnpm run test:integration --reporter=default --reporter=json --outputFile=vitest-report.json
      # All three hosted tiers are asserted, not just TiDB. Each has a real
      # suite (test/integration/tidb.test.ts, the Turso block in
      # test/integration/libsql.test.ts, test/integration/neon.test.ts) that
      # takes a named `test.skip` placeholder when its credential is absent,
      # so without this the job goes green on a missing or misspelled secret
      # while the README claims that backend is covered live. Turso needs
      # both TURSO_URL and TURSO_AUTH_TOKEN; naming TURSO_URL is enough to
      # catch either being unset, since the suite is gated on both together.
      - name: assert the live hosted-tier suites actually ran
        run: .github/scripts/assert-required-suites-ran.sh vitest-report.json TIDB_URL TIDB_URL_2 TURSO_URL NEON_URL

  # Publishes only if every job above actually succeeded — not skipped, not
  # cancelled, not failed. `needs:` alone would already block this job if a
  # dependency fails, but a job that was *skipped* (e.g. `live`, which now
  # skips itself on every pull request — never on the `push` trigger this
  # job requires, but the check stays regardless) must never be mistaken for
  # one that passed, so every result is checked explicitly rather than
  # relying on the implicit behaviour. This is the check that keeps the
  # PR-time saving above from ever turning into an unverified publish.
  release:
    needs: [static, gitleaks, test, live]
    if: >-
      github.repository == 'addwot/cf-knex' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.static.result == 'success' &&
      needs.gitleaks.result == 'success' &&
      needs.test.result == 'success' &&
      needs.live.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Publishes through npm trusted publishing (OIDC). There is deliberately
      # no NPM_TOKEN here and no npm token stored on the repository at all:
      # `id-token: write` above lets pnpm mint a short-lived credential from
      # the OIDC provider per run, so nothing long-lived exists to leak.
      #
      # Three facts this depends on, each verified rather than assumed:
      #
      #  - changesets does NOT shell out to `npm publish` here. Its
      #    `getPublishTool()` detects the package manager from the lockfile
      #    and runs `pnpm publish` when it finds a pnpm one. So npm's OIDC
      #    support is irrelevant to this job; pnpm's is what matters.
      #  - pnpm 10.x cannot do OIDC AT ALL. Unpacked and grepped the real
      #    tarballs: 10.34.5 (latest 10.x) and 10.13.0 both contain zero
      #    references to ACTIONS_ID_TOKEN_REQUEST_URL; 11.20.0 has the full
      #    implementation. Hence the pnpm 11 pin in package.json — dropping
      #    back to 10.x silently disables trusted publishing rather than
      #    failing loudly.
      #  - The trusted publisher itself is configured on npmjs.com against
      #    this repository and this workflow filename. npm does not validate
      #    that configuration when it is saved, so a typo there surfaces only
      #    as a publish failure here. Renaming this file breaks publishing.
      - uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
