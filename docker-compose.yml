services:
  mysql:
    image: mysql:8
    ports: ['3306:3306']
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cf_knex_test
    healthcheck: { test: ['CMD', 'mysqladmin', 'ping', '-proot'], interval: 5s, retries: 20 }
  mariadb:
    image: mariadb:11
    ports: ['3307:3306']
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: cf_knex_test
    healthcheck: { test: ['CMD', 'healthcheck.sh', '--connect'], interval: 5s, retries: 20 }
  postgres:
    image: postgres:16
    ports: ['5432:5432']
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cf_knex_test
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, retries: 20 }
  libsql:
    # Pinned by digest, not `:latest`. `docker compose up` aborts every other
    # service's pull when one fails, so a bad upstream `:latest` takes down
    # mysql/mariadb/postgres with it — locally and in CI alike. This digest is
    # the `latest` index as of 2026-08-04 (multi-arch: linux/amd64, linux/arm64).
    image: ghcr.io/tursodatabase/libsql-server@sha256:07d5da358f37f7f327cc33c1cb5278e7892e04225f011a65a76049372a308982
    ports: ['8080:8080']
    environment:
      SQLD_NODE: primary
    # The image ships no curl or wget, so this is a raw TCP connect through
    # bash's /dev/tcp rather than an HTTP probe. Matches the CI service
    # definition in .github/workflows/ci.yml; without it, `docker compose up -d`
    # returns while sqld is still binding and the first libsql test of a fresh
    # session can race it, unlike the other three services here.
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 5s
      retries: 20
